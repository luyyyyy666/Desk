          type: array
          items:
            $ref: "#/components/schemas/AttemptErrorLink"
    GeneratedQuestionRequest:
      type: object
      required:
        - id
        - userId
        - generationRequestId
        - generationAttempt
        - mode
        - status
        - stem
        - answer
        - explanation
        - knowledgePointLinks
        - expectedErrorTraps
        - gradingRubric
        - difficulty
        - questionType
        - model
        - promptVersion
        - publicKbVersion
        - personalKnowledgeBuildId
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        generationRequestId:
          type: string
        generationAttempt:
          type: integer
        mode:
          type: string
          enum: [stable_bank, llm_tool_generated]
        status:
          type: string
          enum:
            - draft_generated
            - verification_running
            - verification_passed
            - approved_for_practice
            - used_in_daily_practice
            - verification_failed
            - regenerated_once
            - needs_human_review
        stem:
          type: string
        answer:
          type: string
        explanation:
          type: string
        knowledgePointLinks:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedQuestionKnowledgeLink"
        expectedErrorTraps:
          type: array
          items:
            type: string
        gradingRubric:
          type: string
        difficulty:
          type: string
        questionType:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        publicKbVersion:
          type: string
        personalKnowledgeBuildId:
          type: string
        createdAt:
          type: string
          format: date-time
    GeneratedQuestionKnowledgeLink:
      type: object
      required: [knowledgePointId, contentWeight, role]
      properties:
        knowledgePointId:
          type: string
        contentWeight:
          type: number
        role:
          type: string
          enum: [primary, secondary, prerequisite, trap]
    GeneratedQuestionResponse:
      type: object
      required: [question]
      properties:
        question:
          $ref: "#/components/schemas/GeneratedQuestionRequest"
    QuestionVerificationReportRequest:
      type: object
      required: [id, questionId, verifierAgentId, verdict, verifierAnswer, issueSummary, failedReasonType, confidence, createdAt]
      properties:
        id:
          type: string
        questionId:
          type: string
        verifierAgentId:
          type: string
        verdict:
          type: string
          enum: [passed, failed, needs_review]
        verifierAnswer:
          type: string
        issueSummary:
          type: string
        failedReasonType:
          oneOf:
            - type: string
              enum:
                - no_valid_answer
                - answer_mismatch
                - ambiguous_condition
                - explanation_error
                - knowledge_tag_mismatch
                - difficulty_mismatch
            - type: "null"
        confidence:
          type: number
        createdAt:
          type: string
          format: date-time
    QuestionVerificationReportResponse:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/QuestionVerificationReportRequest"
