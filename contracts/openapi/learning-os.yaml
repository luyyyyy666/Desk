openapi: 3.1.0
info:
  title: 我的师傅 Learning OS API
  version: 0.1.0
  description: Phase 1 fixture-backed Rust BFF contract for the PC web Learning OS UI.
servers:
  - url: http://127.0.0.1:4010
paths:
  /health:
    get:
      summary: Check API process health.
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/tasks/current:
    get:
      summary: Read the current Learning OS task and desktop shortcuts.
      responses:
        "200":
          description: Current fixture-backed task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentTaskResponse"
  /api/generation-jobs:
    post:
      summary: Create a fixture-backed generation job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGenerationJobRequest"
      responses:
        "201":
          description: Generation job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/generation-jobs/{job_id}:
    get:
      summary: Read a generation job by id.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Generation job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/generation-jobs/{job_id}/events:
    get:
      summary: Stream generation job progress events.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Server-sent events for future Agent progress.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/questions/{question_set_id}:
    get:
      summary: Read a generated question set.
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
      responses:
        "200":
          description: Question set and questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/mistakes:
    get:
      summary: Read mistake groups and recent wrong question.
      responses:
        "200":
          description: Mistake groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MistakesResponse"
  /api/knowledge/search:
    get:
      summary: Search fixture-backed knowledge points.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Knowledge search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResponse"
  /api/reports/current:
    get:
      summary: Read the current learning report.
      responses:
        "200":
          description: Current fixture-backed report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
  /api/model-gateway/status:
    get:
      summary: Read non-sensitive model gateway configuration status.
      responses:
        "200":
          description: Public New API gateway status. Raw API keys are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelGatewayStatus"
  /api/memory/public-knowledge/status:
    get:
      summary: Read Phase 3 public knowledge base status.
      description: Phase 3 public knowledge schema exists, but curated public knowledge content is intentionally empty.
      responses:
        "200":
          description: Public knowledge base status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKnowledgeStatus"
  /api/memory/public-knowledge/import-empty-seed:
    post:
      summary: Import the empty Phase 3 public knowledge seed.
      description: This endpoint reserves the import path without adding curated public knowledge content.
      responses:
        "200":
          description: Empty public knowledge seed imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKnowledgeImportResponse"
  /api/memory/snapshot/{user_id}:
    get:
      summary: Read the Phase 3 memory snapshot for one user.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Memory, wrong-question, personal knowledge, practice, and verifier summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phase3MemorySnapshot"
  /api/memory/wrong-questions:
    post:
      summary: Record a wrong question as raw evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WrongQuestionCreateRequest"
      responses:
        "201":
          description: Wrong question stored as evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrongQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/user-knowledge-notes:
    post:
      summary: Upsert an editable user note for one knowledge point.
      description: User notes stay separate from calculated mastery state and raw wrong-question evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserKnowledgeNoteRequest"
      responses:
        "200":
          description: User knowledge note saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKnowledgeNoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/user-knowledge-feedback:
    post:
      summary: Record explicit user feedback for one knowledge point.
      description: Feedback can confirm or deny weakness, pause or resume practice, or mark mastery without editing calculated logs directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserKnowledgeFeedbackRequest"
      responses:
        "201":
          description: User knowledge feedback recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKnowledgeFeedbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/user-knowledge/{knowledge_point_id}:
    get:
      summary: Read editable notes and feedback for one user knowledge point.
      parameters:
        - name: knowledge_point_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: User-authored notes and feedback for the knowledge point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKnowledgeNotesAndFeedbackResponse"
  /api/memory/user-knowledge/{knowledge_point_id}/state:
    get:
      summary: Read calculated mastery and review state for one user knowledge point.
      description: This state is calculated by daily practice and user confirmation; clients must not edit it directly.
      parameters:
        - name: knowledge_point_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: Active personal knowledge node and review schedule state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKnowledgeStateResponse"
  /api/memory/personal-knowledge/builds:
    post:
      summary: Activate a rebuildable personal knowledge build.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalKnowledgeBuildActivateRequest"
      responses:
        "201":
          description: Personal knowledge build activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalKnowledgeBuildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/daily-practice/targets:
    get:
      summary: Select due daily-practice targets from personal knowledge state.
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Due personal knowledge targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPracticeTargetsResponse"
  /api/memory/daily-practice/generation-plan:
    get:
      summary: Read Phase 3 first-version daily-practice generation quotas.
      description: This endpoint returns planning quotas only; it does not call LLMs, embeddings, RAG, or question generators.
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [default, enhanced]
            default: default
        - name: target_knowledge_point_ids
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Daily-practice question quota plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPracticeGenerationPlanResponse"
  /api/memory/hybrid-retrieval/plan:
    post:
      summary: Return the Phase 3 hybrid retrieval plan for future RAG.
      description: This endpoint validates retrieval inputs and returns the intended pipeline only; it does not execute embeddings, vector search, reranking, or database retrieval in Phase 3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HybridRetrievalPlanRequest"
      responses:
        "200":
          description: Hybrid retrieval plan contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HybridRetrievalPlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/practice-attempts/analysis:
    post:
      summary: Record practice attempt analysis and weighted error links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAttemptAnalysisRequest"
      responses:
        "201":
          description: Practice attempt analysis recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAttemptAnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/generated-questions:
    post:
      summary: Submit a generated question draft for verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratedQuestionRequest"
      responses:
        "201":
          description: Generated question draft stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/generated-questions/{question_id}/verification/start:
    post:
      summary: Mark generated question verification as running.
      parameters:
        - $ref: "#/components/parameters/GeneratedQuestionId"
      responses:
        "200":
          description: Generated question verification started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/memory/generated-questions/{question_id}/verification-reports:
    post:
      summary: Record an independent verifier report.
      parameters:
        - $ref: "#/components/parameters/GeneratedQuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionVerificationReportRequest"
      responses:
        "201":
          description: Verifier report recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionVerificationReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/generated-questions/{question_id}/approve-for-practice:
    post:
      summary: Approve a verified generated question for practice.
      parameters:
        - $ref: "#/components/parameters/GeneratedQuestionId"
      responses:
        "200":
          description: Generated question approved for practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/generated-questions/{question_id}/used-in-daily-practice:
    post:
      summary: Mark an approved generated question as used in daily practice.
      description: Only approved generated questions can enter daily practice.
      parameters:
        - $ref: "#/components/parameters/GeneratedQuestionId"
      responses:
        "200":
          description: Generated question marked as used in daily practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/embeddings/provider-status:
    get:
      summary: Read Phase 4 embedding provider status.
      description: Raw API keys are never returned; the frontend only receives non-sensitive New API or OpenAI-compatible provider configuration status.
      responses:
        "200":
          description: Non-sensitive embedding provider status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingProviderStatusResponse"
  /rag/ingest:
    post:
      summary: Ingest a plain text knowledge source for Phase 4 RAG.
      description: First implementation supports explicit plain text only; PDF, Word, and textbook-specific parsers are added later when their formats are known.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSourceIngestRequest"
      responses:
        "201":
          description: Knowledge source chunked into stable text chunks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSourceIngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/embeddings/jobs:
    post:
      summary: Create a queued Phase 4 embedding job.
      description: The backend owns provider calls; this contract queues work and does not expose provider credentials to the frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingJobCreateRequest"
      responses:
        "201":
          description: Embedding job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/embeddings/jobs/{job_id}:
    get:
      summary: Read a Phase 4 embedding job by id.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Embedding job status and source summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/knowledge/embedding-search:
    post:
      summary: Execute a Phase 4 embedding search request.
      description: The backend owns query embedding, vector search, source scoring, and future reranking. Provider keys and routing stay outside the frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingSearchPlanRequest"
      responses:
        "200":
          description: Embedding search results with source ids and trust scores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/generation/retrieval-context:
    post:
      summary: Build generation context from Phase 4 retrieval results.
      description: Generation receives retrieval results as context and does not directly query the vector database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationRetrievalContextRequest"
      responses:
        "200":
          description: Retrieval context ready for a generation step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRetrievalContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/plans/generate:
    post:
      summary: Generate a Phase 5 deterministic Agent plan.
      description: Creates a persisted plan for a supported task type and emits a plan_created AgentRun event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanGenerateRequest"
      responses:
        "201":
          description: Plan generated and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/plans/{plan_id}:
    get:
      summary: Read persisted Phase 5 plan progress.
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Persisted plan and current step progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tools:
    get:
      summary: Read the Phase 6 typed Tool Manager registry.
      description: Lists skill-backed tools derived from the Phase 5.5 skill catalog.
      responses:
        "200":
          description: Registered tools and permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolRegistryResponse"
  /api/tool-calls:
    post:
      summary: Execute a Phase 6 tool call through the backend Tool Manager.
      description: The first Phase 6 implementation uses a backend mock executor and records auditable AgentRun events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolCallRequest"
      responses:
        "201":
          description: Tool call recorded with lifecycle events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/tool-calls/{tool_call_id}:
    get:
      summary: Read an auditable Phase 6 tool call record.
      parameters:
        - $ref: "#/components/parameters/ToolCallId"
      responses:
        "200":
          description: Persisted tool call record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallResponse"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    UserIdQuery:
      name: user_id
      in: query
      required: true
      schema:
        type: string
    GeneratedQuestionId:
      name: question_id
      in: path
      required: true
      schema:
        type: string
    QuestionSetId:
      name: question_set_id
      in: path
      required: true
      schema:
        type: string
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
    ToolCallId:
      name: tool_call_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Requested fixture resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [service, status, runtime, toolRegistry]
      properties:
        service:
          type: string
        status:
          type: string
        runtime:
          type: string
        toolRegistry:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    CurrentTaskResponse:
      type: object
      required: [task, learningLoop, desktopShortcuts]
      properties:
        task:
          $ref: "#/components/schemas/CurrentTask"
        learningLoop:
          type: array
          items:
            $ref: "#/components/schemas/LearningLoopStep"
        desktopShortcuts:
          type: array
          items:
            $ref: "#/components/schemas/DesktopShortcut"
    CurrentTask:
      type: object
      required: [title, status, subject, source, goal, questionCount, duration, mastery]
      properties:
        title:
          type: string
        status:
          type: string
        subject:
          type: string
        source:
          type: string
        goal:
          type: string
        questionCount:
          type: integer
        duration:
          type: string
        mastery:
          type: integer
    LearningLoopStep:
      type: object
      required: [id, label, windowId]
      properties:
        id:
          type: string
        label:
          type: string
        windowId:
          type: string
    DesktopShortcut:
      type: object
      required: [id, label, detail, windowId, side, x, y, fileColor]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        windowId:
          type: string
        side:
          type: string
        x:
          type: integer
        y:
          type: integer
        fileColor:
          type: string
    CreateGenerationJobRequest:
      type: object
      required: [learningGoal, subject, questionCount]
      properties:
        learningGoal:
          type: string
        subject:
          type: string
        questionCount:
          type: integer
    GenerationJobResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/GenerationJob"
    GenerationJob:
      type: object
      required: [id, status, questionSetId, progress, message, createdAt, updatedAt]
      properties:
        id:
          type: string
        status:
          type: string
        questionSetId:
          type: string
        progress:
          type: integer
        message:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    QuestionSetResponse:
      type: object
      required: [questionSetId, title, source, questions]
      properties:
        questionSetId:
          type: string
        title:
          type: string
        source:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    Question:
      type: object
      required: [id, type, title, stem, options, answer, explanation, knowledge, difficulty, status]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        stem:
          type: string
        options:
          type: array
          items:
            type: string
        answer:
          type: string
        explanation:
          type: string
        knowledge:
          type: array
          items:
            type: string
        difficulty:
          type: string
        status:
          type: string
    MistakesResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/MistakeGroup"
        recentWrongQuestion:
          $ref: "#/components/schemas/Question"
    MistakeGroup:
      type: object
      required: [knowledge, count, reason, recommendation]
      properties:
        knowledge:
          type: string
        count:
          type: integer
        reason:
          type: string
        recommendation:
          type: string
    KnowledgeSearchResponse:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgePoint"
    KnowledgePoint:
      type: object
      required: [name, coverage, source]
      properties:
        name:
          type: string
        coverage:
          type: integer
        source:
          type: string
    ReportResponse:
      type: object
      required: [metrics, recommendation]
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ReportMetric"
        recommendation:
          type: string
    ReportMetric:
      type: object
      required: [label, value, detail]
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
    ModelGatewayStatus:
      type: object
      required: [provider, baseUrl, defaultModel, apiKeyConfigured, apiKeyHint]
      properties:
        provider:
          type: string
          example: new-api
        baseUrl:
          type: string
          example: http://127.0.0.1:3000
        defaultModel:
          type: string
          example: gpt-4o-mini
        apiKeyConfigured:
          type: boolean
        apiKeyHint:
          type: string
          enum: [configured, missing]
    EmbeddingProviderStatusResponse:
      type: object
      required: [provider]
      properties:
        provider:
          type: object
          required:
            - providerId
            - baseUrlConfigured
            - modelConfigured
            - apiKeyConfigured
            - apiKeyEnvVar
          properties:
            providerId:
              type: string
              example: new_api
            baseUrlConfigured:
              type: boolean
            modelConfigured:
              type: boolean
            apiKeyConfigured:
              type: boolean
            apiKeyEnvVar:
              oneOf:
                - type: string
                - type: "null"
    KnowledgeSourceIngestRequest:
      type: object
      required: [sourceId, title, knowledgeLayer, sourceFormat, text, metadata, createdAt]
      properties:
        sourceId:
          type: string
        title:
          type: string
        knowledgeLayer:
          type: string
          enum: [curriculum, textbook, question, pedagogy, rubric, institution]
        sourceFormat:
          type: string
          enum: [plain_text]
        text:
          type: string
