openapi: 3.1.0
info:
  title: 我的师傅 Learning OS API
  version: 0.1.0
  description: Phase 1 fixture-backed Rust BFF contract for the PC web Learning OS UI.
servers:
  - url: http://127.0.0.1:4010
paths:
  /health:
    get:
      summary: Check API process health.
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/tasks/current:
    get:
      summary: Read the current Learning OS task and desktop shortcuts.
      responses:
        "200":
          description: Current fixture-backed task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentTaskResponse"
  /api/generation-jobs:
    post:
      summary: Create a fixture-backed generation job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGenerationJobRequest"
      responses:
        "201":
          description: Generation job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/generation-jobs/{job_id}:
    get:
      summary: Read a generation job by id.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Generation job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/generation-jobs/{job_id}/events:
    get:
      summary: Stream generation job progress events.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Server-sent events for future Agent progress.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/questions/{question_set_id}:
    get:
      summary: Read a generated question set.
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
      responses:
        "200":
          description: Question set and questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/mistakes:
    get:
      summary: Read mistake groups and recent wrong question.
      responses:
        "200":
          description: Mistake groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MistakesResponse"
  /api/knowledge/search:
    get:
      summary: Search fixture-backed knowledge points.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Knowledge search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResponse"
  /api/reports/current:
    get:
      summary: Read the current learning report.
      responses:
        "200":
          description: Current fixture-backed report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
  /api/model-gateway/status:
    get:
      summary: Read non-sensitive model gateway configuration status.
      responses:
        "200":
          description: Public New API gateway status. Raw API keys are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelGatewayStatus"
  /api/memory/public-knowledge/status:
    get:
      summary: Read Phase 3 public knowledge base status.
      description: Phase 3 public knowledge schema exists, but curated public knowledge content is intentionally empty.
      responses:
        "200":
          description: Public knowledge base status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKnowledgeStatus"
  /api/memory/public-knowledge/import-empty-seed:
    post:
      summary: Import the empty Phase 3 public knowledge seed.
      description: This endpoint reserves the import path without adding curated public knowledge content.
      responses:
        "200":
          description: Empty public knowledge seed imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKnowledgeImportResponse"
  /api/memory/snapshot/{user_id}:
    get:
      summary: Read the Phase 3 memory snapshot for one user.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Memory, wrong-question, personal knowledge, practice, and verifier summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phase3MemorySnapshot"
  /api/memory/wrong-questions:
    post:
      summary: Record a wrong question as raw evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WrongQuestionCreateRequest"
      responses:
        "201":
          description: Wrong question stored as evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrongQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/user-knowledge-notes:
    post:
      summary: Upsert an editable user note for one knowledge point.
      description: User notes stay separate from calculated mastery state and raw wrong-question evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserKnowledgeNoteRequest"
      responses:
        "200":
          description: User knowledge note saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKnowledgeNoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/user-knowledge-feedback:
    post:
      summary: Record explicit user feedback for one knowledge point.
      description: Feedback can confirm or deny weakness, pause or resume practice, or mark mastery without editing calculated logs directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserKnowledgeFeedbackRequest"
      responses:
        "201":
          description: User knowledge feedback recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKnowledgeFeedbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/user-knowledge/{knowledge_point_id}:
    get:
      summary: Read editable notes and feedback for one user knowledge point.
      parameters:
        - name: knowledge_point_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: User-authored notes and feedback for the knowledge point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKnowledgeNotesAndFeedbackResponse"
  /api/memory/personal-knowledge/builds:
    post:
      summary: Activate a rebuildable personal knowledge build.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalKnowledgeBuildActivateRequest"
      responses:
        "201":
          description: Personal knowledge build activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalKnowledgeBuildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/daily-practice/targets:
    get:
      summary: Select due daily-practice targets from personal knowledge state.
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Due personal knowledge targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPracticeTargetsResponse"
  /api/memory/practice-attempts/analysis:
    post:
      summary: Record practice attempt analysis and weighted error links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAttemptAnalysisRequest"
      responses:
        "201":
          description: Practice attempt analysis recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAttemptAnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/generated-questions:
    post:
      summary: Submit a generated question draft for verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratedQuestionRequest"
      responses:
        "201":
          description: Generated question draft stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/generated-questions/{question_id}/verification/start:
    post:
      summary: Mark generated question verification as running.
      parameters:
        - $ref: "#/components/parameters/GeneratedQuestionId"
      responses:
        "200":
          description: Generated question verification started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/memory/generated-questions/{question_id}/verification-reports:
    post:
      summary: Record an independent verifier report.
      parameters:
        - $ref: "#/components/parameters/GeneratedQuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionVerificationReportRequest"
      responses:
        "201":
          description: Verifier report recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionVerificationReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/memory/generated-questions/{question_id}/approve-for-practice:
    post:
      summary: Approve a verified generated question for practice.
      parameters:
        - $ref: "#/components/parameters/GeneratedQuestionId"
      responses:
        "200":
          description: Generated question approved for practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    UserIdQuery:
      name: user_id
      in: query
      required: true
      schema:
        type: string
    GeneratedQuestionId:
      name: question_id
      in: path
      required: true
      schema:
        type: string
    QuestionSetId:
      name: question_set_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Requested fixture resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [service, status, runtime, toolRegistry]
      properties:
        service:
          type: string
        status:
          type: string
        runtime:
          type: string
        toolRegistry:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    CurrentTaskResponse:
      type: object
      required: [task, learningLoop, desktopShortcuts]
      properties:
        task:
          $ref: "#/components/schemas/CurrentTask"
        learningLoop:
          type: array
          items:
            $ref: "#/components/schemas/LearningLoopStep"
        desktopShortcuts:
          type: array
          items:
            $ref: "#/components/schemas/DesktopShortcut"
    CurrentTask:
      type: object
      required: [title, status, subject, source, goal, questionCount, duration, mastery]
      properties:
        title:
          type: string
        status:
          type: string
        subject:
          type: string
        source:
          type: string
        goal:
          type: string
        questionCount:
          type: integer
        duration:
          type: string
        mastery:
          type: integer
    LearningLoopStep:
      type: object
      required: [id, label, windowId]
      properties:
        id:
          type: string
        label:
          type: string
        windowId:
          type: string
    DesktopShortcut:
      type: object
      required: [id, label, detail, windowId, side, x, y, fileColor]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        windowId:
          type: string
        side:
          type: string
        x:
          type: integer
        y:
          type: integer
        fileColor:
          type: string
    CreateGenerationJobRequest:
      type: object
      required: [learningGoal, subject, questionCount]
      properties:
        learningGoal:
          type: string
        subject:
          type: string
        questionCount:
          type: integer
    GenerationJobResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/GenerationJob"
    GenerationJob:
      type: object
      required: [id, status, questionSetId, progress, message, createdAt, updatedAt]
      properties:
        id:
          type: string
        status:
          type: string
        questionSetId:
          type: string
        progress:
          type: integer
        message:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    QuestionSetResponse:
      type: object
      required: [questionSetId, title, source, questions]
      properties:
        questionSetId:
          type: string
        title:
          type: string
        source:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    Question:
      type: object
      required: [id, type, title, stem, options, answer, explanation, knowledge, difficulty, status]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        stem:
          type: string
        options:
          type: array
          items:
            type: string
        answer:
          type: string
        explanation:
          type: string
        knowledge:
          type: array
          items:
            type: string
        difficulty:
          type: string
        status:
          type: string
    MistakesResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/MistakeGroup"
        recentWrongQuestion:
          $ref: "#/components/schemas/Question"
    MistakeGroup:
      type: object
      required: [knowledge, count, reason, recommendation]
      properties:
        knowledge:
          type: string
        count:
          type: integer
        reason:
          type: string
        recommendation:
          type: string
    KnowledgeSearchResponse:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgePoint"
    KnowledgePoint:
      type: object
      required: [name, coverage, source]
      properties:
        name:
          type: string
        coverage:
          type: integer
        source:
          type: string
    ReportResponse:
      type: object
      required: [metrics, recommendation]
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ReportMetric"
        recommendation:
          type: string
    ReportMetric:
      type: object
      required: [label, value, detail]
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
    ModelGatewayStatus:
      type: object
      required: [provider, baseUrl, defaultModel, apiKeyConfigured, apiKeyHint]
      properties:
        provider:
          type: string
          example: new-api
        baseUrl:
          type: string
          example: http://127.0.0.1:3000
        defaultModel:
          type: string
          example: gpt-4o-mini
        apiKeyConfigured:
          type: boolean
        apiKeyHint:
          type: string
          enum: [configured, missing]
    PublicKnowledgeStatus:
      type: object
      required: [knowledgePoints, tags, edges, isEmpty]
      properties:
        knowledgePoints:
          type: integer
          example: 0
        tags:
          type: integer
          example: 0
        edges:
          type: integer
          example: 0
        isEmpty:
          type: boolean
          example: true
    PublicKnowledgeImportResponse:
      type: object
      required: [imported, publicKnowledge]
      properties:
        imported:
          type: object
          required: [knowledgePoints, tags, pointTags, edges]
          properties:
            knowledgePoints:
              type: integer
            tags:
              type: integer
            pointTags:
              type: integer
            edges:
              type: integer
        publicKnowledge:
          $ref: "#/components/schemas/PublicKnowledgeStatus"
    ActivePersonalKnowledgeBuild:
      type: object
      required: [buildId, buildVersion, status, publicKbVersion]
      properties:
        buildId:
          type: string
        buildVersion:
          type: integer
        status:
          type: string
          enum: [building, active, superseded, failed]
        publicKbVersion:
          type: string
    Phase3MemorySnapshot:
      type: object
      required:
        - userId
        - publicKnowledge
        - wrongQuestionCount
        - activePersonalBuild
        - personalNodeCount
        - personalEdgeCount
        - personalEvidenceCount
        - userKnowledgeNoteCount
        - userKnowledgeFeedbackCount
        - dueReviewCount
        - practiceAttemptCount
        - practiceAnalysisCount
        - generatedQuestionCount
        - approvedGeneratedQuestionCount
      properties:
        userId:
          type: string
        publicKnowledge:
          $ref: "#/components/schemas/PublicKnowledgeStatus"
        wrongQuestionCount:
          type: integer
        activePersonalBuild:
          oneOf:
            - $ref: "#/components/schemas/ActivePersonalKnowledgeBuild"
            - type: "null"
        personalNodeCount:
          type: integer
        personalEdgeCount:
          type: integer
        personalEvidenceCount:
          type: integer
        userKnowledgeNoteCount:
          type: integer
        userKnowledgeFeedbackCount:
          type: integer
        dueReviewCount:
          type: integer
        practiceAttemptCount:
          type: integer
        practiceAnalysisCount:
          type: integer
        generatedQuestionCount:
          type: integer
        approvedGeneratedQuestionCount:
          type: integer
    WrongQuestionCreateRequest:
      type: object
      required: [id, userId, questionText, correctAnswer, userAnswer, explanation, source, subject, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        questionText:
          type: string
        correctAnswer:
          type: string
        userAnswer:
          type: string
        explanation:
          type: string
        source:
          type: string
        subject:
          type: string
        createdAt:
          type: string
          format: date-time
        knowledgeLinks:
          type: array
          items:
            $ref: "#/components/schemas/WrongQuestionKnowledgeLink"
        tagLinks:
          type: array
          items:
            $ref: "#/components/schemas/TagLink"
    WrongQuestionKnowledgeLink:
      type: object
      required: [knowledgePointId, role, contentWeight, source, confidence]
      properties:
        knowledgePointId:
          type: string
        role:
          type: string
          enum: [primary, secondary, prerequisite, trap]
        contentWeight:
          type: number
        source:
          type: string
          enum: [public_kb, llm, manual]
        confidence:
          type: number
    TagLink:
      type: object
      required: [tagId, source, confidence]
      properties:
        tagId:
          type: string
        source:
          type: string
          enum: [public_kb, llm, manual]
        confidence:
          type: number
    WrongQuestionResponse:
      type: object
      required: [wrongQuestion]
      properties:
        wrongQuestion:
          $ref: "#/components/schemas/WrongQuestionCreateRequest"
    UserKnowledgeNoteRequest:
      type: object
      required: [id, userId, knowledgePointId, note, customTags, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        knowledgePointId:
          type: string
        note:
          type: string
        customTags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserKnowledgeNoteResponse:
      type: object
      required: [note]
      properties:
        note:
          $ref: "#/components/schemas/UserKnowledgeNoteRequest"
    UserKnowledgeFeedbackRequest:
      type: object
      required: [id, userId, knowledgePointId, feedbackType, comment, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        knowledgePointId:
          type: string
        feedbackType:
          type: string
          enum:
            - confirm_weakness
            - deny_weakness
            - pause_practice
            - resume_practice
            - mark_mastered
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
    UserKnowledgeFeedbackResponse:
      type: object
      required: [feedback]
      properties:
        feedback:
          $ref: "#/components/schemas/UserKnowledgeFeedbackRequest"
    UserKnowledgeNotesAndFeedbackResponse:
      type: object
      required: [notes, feedback]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/UserKnowledgeNoteRequest"
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/UserKnowledgeFeedbackRequest"
    PersonalKnowledgeBuildActivateRequest:
      type: object
      required: [build, nodes, edges, evidence]
      properties:
        build:
          $ref: "#/components/schemas/PersonalKnowledgeBuild"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/PersonalKnowledgeNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/PersonalKnowledgeEdge"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PersonalKnowledgeEvidence"
    PersonalKnowledgeBuild:
      type: object
      required: [id, userId, buildVersion, model, promptVersion, publicKbVersion, status, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        buildVersion:
          type: integer
        model:
          type: string
        promptVersion:
          type: string
        publicKbVersion:
          type: string
        status:
          type: string
          enum: [building, active, superseded, failed]
        createdAt:
          type: string
          format: date-time
    PersonalKnowledgeNode:
      type: object
      required:
        - id
        - buildId
        - userId
        - knowledgePointId
        - masteryState
        - masteryScore
        - weaknessScore
        - confidence
        - evidenceCount
        - summary
        - summaryForEmbedding
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        buildId:
          type: string
        userId:
          type: string
        knowledgePointId:
          type: string
        masteryState:
          type: string
          enum: [weak, learning, reviewing, mastered_pending_confirm, mastered]
        masteryScore:
          type: number
        weaknessScore:
          type: number
        confidence:
          type: number
        evidenceCount:
          type: integer
        summary:
          type: string
        summaryForEmbedding:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PersonalKnowledgeEdge:
      type: object
      required:
        - id
        - buildId
        - userId
        - sourceKnowledgePointId
        - targetKnowledgePointId
        - relationType
        - weight
        - confidence
        - evidenceCount
        - summary
        - summaryForEmbedding
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        buildId:
          type: string
        userId:
          type: string
        sourceKnowledgePointId:
          type: string
        targetKnowledgePointId:
          type: string
        relationType:
          type: string
          enum: [co_failed, co_practiced, confused_with, prerequisite_gap, improves_with]
        weight:
          type: number
        confidence:
          type: number
        evidenceCount:
          type: integer
        summary:
          type: string
        summaryForEmbedding:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PersonalKnowledgeEvidence:
      type: object
      required: [id, buildId, userId, targetType, targetId, evidenceType, evidenceId, analysisSummary, createdAt]
      properties:
        id:
          type: string
        buildId:
          type: string
        userId:
          type: string
        targetType:
          type: string
          enum: [node, edge]
        targetId:
          type: string
        evidenceType:
          type: string
          enum: [wrong_question, practice_attempt, explicit_feedback, manual_confirmation]
        evidenceId:
          type: string
        analysisSummary:
          type: string
        createdAt:
          type: string
          format: date-time
    PersonalKnowledgeBuildResponse:
      type: object
      required: [build]
      properties:
        build:
          $ref: "#/components/schemas/PersonalKnowledgeBuild"
    DailyPracticeTargetsResponse:
      type: object
