services:
  postgres:
    image: postgres:17-alpine
    container_name: my-sifu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_sifu}
      POSTGRES_USER: ${POSTGRES_USER:-my_sifu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_sifu}
    ports:
      - "5432:5432"
    volumes:
      - my_sifu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-my_sifu} -d $${POSTGRES_DB:-my_sifu}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: my-sifu-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - my_sifu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: my-sifu-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-my_sifu_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-my_sifu_minio_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - my_sifu_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  new-api:
    image: calciumion/new-api:latest
    container_name: my-sifu-new-api
    environment:
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:-replace-with-local-development-secret}
    ports:
      - "3000:3000"
    volumes:
      - my_sifu_new_api_data:/data

volumes:
  my_sifu_postgres_data:
  my_sifu_redis_data:
  my_sifu_minio_data:
  my_sifu_new_api_data:
