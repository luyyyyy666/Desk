[project]
name = "my-sifu"
version = "0.1.0"
description = "Python workspace for AI, RAG, evaluation, and development checks for 我的师傅."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.0.1",
  "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "frontend/.next",
  "frontend/node_modules",
  "frontend/test-results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
pythonpath = ["python"]
