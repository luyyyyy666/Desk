[workspace]
members = [
  "apps/api",
  "crates/agent-core",
  "crates/domain",
  "crates/persistence",
  "crates/tool-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
anyhow = "1.0.100"
axum = "0.8.7"
domain = { path = "crates/domain" }
persistence = { path = "crates/persistence" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tool-runtime = { path = "crates/tool-runtime" }
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
